<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX server | 奇迹与未来</title>
    <style>
        :root {
            /* 干净清爽的自然色调，无任何夸张的蓝光发光特效 */
            --accent: #0284c7; 
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #eff6ff 100%);
            --ark-bezier: cubic-bezier(0.25, 1, 0.5, 1); 
            --domino-bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-gradient) !important;
            overflow: hidden; 
            color: #1e293b; font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            user-select: none;
        }

        /* ================= 极简轻量加载遮罩 ================= */
        #global-app-loading-container {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #dbeafe 0%, #f0fdf4 100%);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            will-change: transform, opacity;
        }

        #global-app-loading-container.loader-vanish {
            opacity: 0; pointer-events: none; transform: scale(1.02);
        }

        .loading-quantum-box {
            width: 240px; display: flex; flex-direction: column; gap: 12px; text-align: left;
        }

        .loading-status-row {
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        .loading-brand-tag {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 3px; color: #0284c7;
            font-family: monospace;
        }

        .loading-percentage-num {
            font-size: 0.8rem; font-family: monospace; color: #475569;
        }

        .loading-track-bar {
            width: 100%; height: 2px; background: rgba(0, 0, 0, 0.08);
            border-radius: 2px; overflow: hidden; position: relative;
        }

        .loading-fill-runner {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            background: #0284c7;
            transition: width 0.2s ease-out;
        }

        .loading-system-tip {
            font-size: 0.65rem; color: #64748b; letter-spacing: 1px;
            text-transform: uppercase; margin-top: -2px;
        }

        /* --- 顶部全局导航栏（干净清爽，无劣质光印） --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 74px !important;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; 
            background: transparent !important;
            border-bottom: none !important;
            box-shadow: none !important;
            z-index: 3000;
        }
        .header-left { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        
        .header-logo { 
            font-size: 1.3rem !important; 
            letter-spacing: 3px; 
            font-weight: 700 !important; 
            color: #0284c7; 
            white-space: nowrap;
        }

        .nav-menu { display: flex; gap: 36px; height: 74px; align-items: center; position: relative; margin-left: auto; }

        .nav-btn {
            font-size: 1.05rem !important; 
            font-weight: 600 !important; 
            color: #334155; cursor: pointer;
            transition: color 0.2s ease; 
            position: relative; letter-spacing: 1px; white-space: nowrap;
            padding: 14px 4px; z-index: 2;
        }

        .nav-btn:active { transform: scale(0.95); }

        .nav-btn:hover, .nav-btn.active { 
            color: #0284c7 !important; 
        }

        /* --- 主舞台（大厅视界与完美动态背景恢复） --- */
        #main-stage { 
            position: relative; width: 100%; height: 100%; z-index: 10; 
            background: transparent; 
            opacity: 1; transform: scale(1);
            transition: opacity 0.35s var(--ark-bezier), transform 0.35s var(--ark-bezier);
        }
        #main-stage.stage-hidden { 
            opacity: 0; transform: scale(0.96);
            pointer-events: none !important; 
        }
        #star-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .character-split-layer {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(224, 242, 254, 0.3) 50%, transparent 50.01%);
            pointer-events: none;
        }

        .view-homepage-content { width: 100%; height: 100%; position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; }
        .center-hero { text-align: center; z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        
        .title-large { 
            font-size: clamp(2.8rem, 5.5vw, 4.8rem); 
            letter-spacing: 10px; 
            font-weight: 700; 
            color: #0f172a; 
            margin: 0; 
        }
        .title-sub { 
            font-size: clamp(0.95rem, 1.5vw, 1.25rem); 
            letter-spacing: 8px; 
            color: #0284c7; 
            font-weight: 600;
            margin: 15px 0 0 0; 
        }
        .quote-text { 
            margin-top: 5vh; 
            font-size: clamp(0.8rem, 1vw, 0.95rem); 
            color: #475569; 
            letter-spacing: 2px; 
            line-height: 1.8; 
            max-width: 600px; 
            background: rgba(255, 255, 255, 0.75);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .hero-arrow-wrap {
            margin-top: 32px; pointer-events: auto; cursor: pointer;
            animation: arrowFloatHorizontal 2.5s ease-in-out infinite alternate;
        }
        @keyframes arrowFloatHorizontal { 0% { transform: translateX(-8px); } 100% { transform: translateX(8px); } }
        
        .hero-arrow-circle {
            display: flex; align-items: center; justify-content: center; width: 56px; height: 56px;
            background: #0284c7; border-radius: 50%; 
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .hero-arrow-wrap:active .hero-arrow-circle { transform: scale(0.9); }
        .hero-arrow-circle svg { width: 22px; height: 22px; fill: none; stroke: #ffffff; stroke-width: 2.8; }
        .hero-arrow-wrap:hover .hero-arrow-circle { transform: scale(1.08); background: #0369a1; }

        /* ================= 视窗切换控制引擎（轻量丝滑） ================= */
        .fullview-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1500; 
            padding: 90px 6% 40px 6%;
            background: rgba(240, 245, 255, 0.96); 
            display: flex; flex-direction: column; overflow-y: auto; 
            pointer-events: none !important;
            display: none; 
            opacity: 0;
            transition: opacity 0.3s var(--ark-bezier), transform 0.3s var(--ark-bezier);
            will-change: opacity, transform;
        }

        .fullview-overlay.render-block { display: flex; }
        .fullview-overlay.prepare-from-right { opacity: 0; transform: translateX(30px); }
        .fullview-overlay.prepare-from-left  { opacity: 0; transform: translateX(-30px); }
        .fullview-overlay.active-page { 
            opacity: 1; 
            transform: translateX(0) scale(1) !important;
            pointer-events: auto !important; 
        }
        .fullview-overlay.exit-to-left  { opacity: 0; transform: translateX(-30px) scale(0.98); pointer-events: none !important; }
        .fullview-overlay.exit-to-right { opacity: 0; transform: translateX(30px) scale(0.98); pointer-events: none !important; }

        .fullview-overlay::-webkit-scrollbar, 
        .noti-sidebar-list::-webkit-scrollbar, 
        .generic-detail-panel::-webkit-scrollbar,
        .media-grid-container::-webkit-scrollbar { width: 4px; }
        .fullview-overlay::-webkit-scrollbar-thumb, 
        .noti-sidebar-list::-webkit-scrollbar-thumb, 
        .generic-detail-panel::-webkit-scrollbar-thumb,
        .media-grid-container::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.2); border-radius: 4px; }

        .page-header-area { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(2, 132, 199, 0.15); padding-bottom: 12px; margin-bottom: 24px; flex-shrink: 0; }
        .page-main-title { font-size: clamp(1.4rem, 2.2vw, 2.2rem); font-weight: 700; margin: 0; letter-spacing: 3px; color: #0f172a; }
        .page-sub-title { font-size: 0.8rem; color: #0284c7; letter-spacing: 2px; margin-top: 5px; font-family: monospace; font-weight: 600; }
        
        .page-back-btn {
            display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #334155;
            cursor: pointer; transition: color 0.2s ease; border: 1px solid rgba(2, 132, 199, 0.25); padding: 7px 18px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
        }
        .page-back-btn:active { transform: scale(0.95); }
        .page-back-btn:hover { color: #0284c7; border-color: #0284c7; }

        /* ================= 轮播组件 ================= */
        .slider-showcase-container { display: flex; align-items: center; justify-content: center; width: 100%; gap: 30px; position: relative; margin-top: 10px; flex-shrink: 0; }
        .cards-viewport { display: flex; align-items: center; justify-content: center; width: 85%; height: clamp(240px, 32vh, 380px); position: relative; overflow: hidden; }

        .showcase-card {
            position: absolute; width: 55%; height: 100%; 
            background-size: cover; background-position: center; 
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px; 
            overflow: hidden; 
            transition: transform 0.35s var(--ark-bezier), opacity 0.35s var(--ark-bezier); 
            opacity: 0; pointer-events: none; z-index: 1;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .showcase-card.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1) translateX(0); 
            z-index: 3; 
            border-color: #0284c7; 
        }
        .showcase-card.prev { opacity: 0.3; transform: scale(0.88) translateX(-65%); z-index: 2; }
        .showcase-card.next { opacity: 0.3; transform: scale(0.88) translateX(65%); z-index: 2; }
        
        .slide-arrow { font-size: 2rem; color: #0284c7; cursor: pointer; transition: color 0.2s ease; padding: 10px; z-index: 10; user-select: none; font-weight: bold; }
        .slide-arrow:active { transform: scale(0.9); }
        .slide-arrow:hover { color: #0369a1; }

        .indicator-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; align-items: center; flex-shrink: 0; }
        .indicator-dot { width: 8px; height: 8px; background: rgba(2, 132, 199, 0.2); border-radius: 50%; transition: transform 0.2s, background 0.2s; cursor: pointer; }
        .indicator-dot.active { background: #0284c7; transform: scale(1.4); }

        .content-display-panel { width: 100%; max-width: 900px; margin: 10px auto 0 auto; text-align: left; }
        .dynamic-title-group { margin-bottom: 16px; }
        .dynamic-main-title { font-size: 1.8rem; font-weight: 700; margin: 0 0 8px 0; color: #0f172a; letter-spacing: 1px; }
        .dynamic-sub-quote { font-size: 1rem; color: #0284c7; font-weight: 700; letter-spacing: 1px; margin-bottom: 16px; display: block; }
        .dynamic-body-text { font-size: 0.98rem; color: #334155; line-height: 1.9; text-align: justify; padding-bottom: 60px; }

        /* ================= 告示页面 ================= */
        .page-layout-container { display: flex; gap: 30px; flex-grow: 1; height: calc(100vh - 210px); min-height: 400px; overflow: hidden; }
        .noti-sidebar-list { width: 32%; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 6px; height: 100%; padding-bottom: 40px; }
        
        .noti-item-card { 
            background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(2, 132, 199, 0.15); padding: 16px; border-radius: 10px; cursor: pointer; 
            transition: border-color 0.2s ease, background 0.2s ease; flex-shrink: 0; 
        }
        .noti-item-card:active { transform: scale(0.97); }
        .noti-item-card:hover { background: #ffffff; border-color: rgba(2, 132, 199, 0.4); }
        .noti-item-card.item-active { 
            background: #ffffff; 
            border-color: #0284c7; 
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.1); 
        }
        .noti-item-date { font-size: 0.75rem; color: #0284c7; font-family: monospace; letter-spacing: 0.5px; font-weight: 600; }
        .noti-item-title { font-size: 0.92rem; margin: 6px 0 0 0; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .noti-item-card.item-active .noti-item-title { color: #0284c7; }

        .generic-detail-panel { width: 68%; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(2, 132, 199, 0.15); border-radius: 12px; padding: 35px; overflow-y: auto; height: 100%; padding-bottom: 40px; }
        .detail-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 10px 0; color: #0f172a; letter-spacing: 0.5px; line-height: 1.4; }
        .detail-meta { font-size: 0.8rem; color: #0284c7; font-family: monospace; border-bottom: 1px solid rgba(2, 132, 199, 0.15); padding-bottom: 14px; margin-bottom: 22px; font-weight: 600; }
        .detail-content { line-height: 1.85; color: #334155; font-size: 0.95rem; text-align: justify; }
        .detail-content p { margin: 0 0 16px 0; }

        /* ================= 媒体页面 ================= */
        .media-capsule-container { display: flex; gap: 14px; margin: 5px 0 20px 0; flex-shrink: 0; list-style: none; padding: 0; }
        
        .media-capsule-btn {
            padding: 7px 22px; font-size: 0.85rem; font-weight: 600; color: #475569;
            background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(2, 132, 199, 0.2); border-radius: 30px;
            cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px;
        }
        .media-capsule-btn:active { transform: scale(0.95); }
        .media-capsule-btn.capsule-active {
            background: #0284c7; color: #ffffff; border-color: #0284c7;
            font-weight: 700;
        }

        .media-grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            overflow-y: auto; 
            height: calc(100vh - 220px); 
            padding-bottom: 40px; 
            width: 100%; 
            -webkit-overflow-scrolling: touch;
        }

        .media-matrix-card {
            background: rgba(255, 255, 255, 0.95); 
            border: 1px solid rgba(2, 132, 199, 0.2); 
            padding: 0; border-radius: 12px; 
            cursor: pointer; position: relative; width: 100%;
            height: fit-content; 
            overflow: hidden; 
            opacity: 0; 
            transform: translateY(20px);
            display: flex; flex-direction: column;
            transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }
        .media-matrix-card:active { transform: scale(0.97) !important; }
        .media-matrix-card.reveal-manifest { opacity: 1 !important; transform: translateY(0) !important; }
        .media-matrix-card:hover { border-color: #0284c7; transform: translateY(-3px) !important; }

        .matrix-video-cover-wrap { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #e2e8f0; flex-shrink: 0; }
        .matrix-video-cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .matrix-play-indicator { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); transition: background 0.2s; z-index: 2; }
        .media-matrix-card:hover .matrix-play-indicator { background: rgba(0,0,0,0.25); }

        .matrix-play-icon {
            width: 40px; height: 40px; background: #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff;
            font-size: 0.85rem; padding-left: 3px; 
        }

        .matrix-card-title { 
            font-size: 0.86rem; font-weight: 600; color: #1e293b; margin: 0;
            padding: 12px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .media-matrix-card:hover .matrix-card-title { color: #0284c7; }

        /* ================= 影院弹窗 ================= */
        .cinema-theater-backdrop {
            position: fixed; inset: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0); 
            z-index: 6000; display: none; align-items: center; justify-content: center; opacity: 0;
            transition: opacity 0.3s ease, background 0.3s ease;
        }
        .cinema-theater-backdrop.theater-manifest {
            display: flex; opacity: 1;
            background: rgba(15, 23, 42, 0.85); 
        }

        .cinema-theater-window {
            width: 90%; max-width: 1060px; aspect-ratio: 16 / 9; background: #000;
            position: relative; border-radius: 16px;
            overflow: hidden; transform: translateY(30px) scale(0.97); border: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.3s var(--ark-bezier);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .cinema-theater-backdrop.theater-manifest .cinema-theater-window { transform: translateY(0) scale(1); }

        .cinema-close-trigger {
            position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.9);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #0f172a; font-size: 0.95rem; cursor: pointer; z-index: 100; transition: transform 0.2s ease;
        }
        .cinema-close-trigger:active { transform: scale(0.9); }
        .cinema-close-trigger:hover { background: #ffffff; color: #0284c7; }

        .cinema-iframe-core { width: 100%; height: 100%; border: none; display: block; background: #000; }

        .cinema-fallback-dock {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, 0.95);
            padding: 8px 22px; border-radius: 30px; border: 1px solid rgba(2, 132, 199, 0.2);
            z-index: 50; pointer-events: auto;
        }
        .fallback-text { font-size: 0.8rem; color: #475569; letter-spacing: 0.5px; font-weight: 500; }
        .fallback-action-btn {
            font-size: 0.8rem; color: #0284c7; text-decoration: none; font-weight: 700;
            border-bottom: 1px dashed #0284c7; padding-bottom: 1px;
        }
    </style>
</head>
<body>

    <div id="global-app-loading-container">
        <div class="loading-quantum-box">
            <div class="loading-status-row">
                <span class="loading-brand-tag">SYSTEM READY</span>
                <span class="loading-percentage-num" id="load-num-node">0%</span>
            </div>
            <div class="loading-track-bar">
                <div class="loading-fill-runner" id="load-bar-node"></div>
            </div>
            <div class="loading-system-tip">Loading interface...</div>
        </div>
    </div>

    <header class="top-header">
        <div class="header-left">
            <div class="header-logo" id="site-logo">MX server</div>
            <nav class="nav-menu" id="nav-menu-wrapper">
            </nav>
        </div>
    </header>

    <div id="main-stage">
        <canvas id="star-canvas"></canvas>
        <div class="character-split-layer"></div>
        <div class="view-homepage-content">
            <div class="center-hero">
                <h1 class="title-large" id="hero-title">新・奇迹城</h1>
                <div class="title-sub" id="hero-subtitle">梦想家，月夜见</div>
                <p class="quote-text" id="hero-quote">「其实，我们都在追寻自己梦想」—— 追寻你的梦想吧，冲向未来的列车正平稳冲过中央干线。</p>
                <div class="hero-arrow-wrap" id="hero-arrow-btn" title="进入视界">
                    <div class="hero-arrow-circle">
                        <svg viewBox="0 0 24 24"><polyline points="8 5 16 12 8 19"></polyline></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 动态渲染各板块页面的容器 -->
    <div id="dynamic-pages-container"></div>

    <div class="cinema-theater-backdrop" id="global-cinema-layer" onclick="closeCinemaTheater()">
        <div class="cinema-theater-window" onclick="event.stopPropagation()">
            <div class="cinema-close-trigger" onclick="closeCinemaTheater()">✕</div>
            <div id="cinema-injection-point" style="width:100%; height:100%;"></div>
            <div class="cinema-fallback-dock">
                <span class="fallback-text">如果视频无法加载或遭遇官方拦截</span>
                <a href="#" id="cinema-fallback-anchor" target="_blank" class="fallback-action-btn">跳转至独立视频源观看 ↗</a>
            </div>
        </div>
    </div>

    <!-- 严格保留外部JS依赖项 -->
    <script src="data.js"></script>

    <script>
        const safeData = window.WEBSITE_DATA || { siteInfo: {}, pages: [] };
        const pagesConfig = safeData.pages || [];
        const PAGE_SEQUENCE = pagesConfig.map(p => p.id);

        let currentPageId = 'home';
        let currentActiveNotiIdx = 0;
        let sliderIndices = {};

        function initDynamicStructure() {
            if (safeData.siteInfo) {
                if (safeData.siteInfo.brandName) document.getElementById('site-logo').innerText = safeData.siteInfo.brandName;
                if (safeData.siteInfo.heroTitle) document.getElementById('hero-title').innerText = safeData.siteInfo.heroTitle;
                if (safeData.siteInfo.heroSubTitle) document.getElementById('hero-subtitle').innerText = safeData.siteInfo.heroSubTitle;
                if (safeData.siteInfo.heroQuote) document.getElementById('hero-quote').innerText = safeData.siteInfo.heroQuote;
            }

            const navWrapper = document.getElementById('nav-menu-wrapper');
            
            pagesConfig.forEach((page, index) => {
                const btn = document.createElement('div');
                btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
                btn.id = `nav-${page.id}`;
                btn.innerText = page.navName;
                btn.onclick = () => navigateToPage(page.id);
                navWrapper.appendChild(btn);
            });

            const container = document.getElementById('dynamic-pages-container');
            container.innerHTML = '';

            pagesConfig.forEach(page => {
                if (page.type === 'home') return;

                const overlay = document.createElement('div');
                overlay.id = `view-${page.id}-page`;
                overlay.className = 'fullview-overlay';
                if (page.type === 'news') overlay.style.overflowY = 'hidden';

                if (page.type === 'slider') {
                    sliderIndices[page.id] = 0;
                    overlay.innerHTML = `
                        <div class="page-header-area">
                            <div>
                                <h2 class="page-main-title">${page.title || ''}</h2>
                                <div class="page-sub-title">${page.subTitle || ''}</div>
                            </div>
                            <div class="page-back-btn" onclick="navigateToPage('home')"><span>返回主页</span></div>
                        </div>
                        <div class="slider-showcase-container">
                            <div class="slide-arrow" onclick="moveSlider('${page.id}', -1)">〈</div>
                            <div class="cards-viewport" id="cards-viewport-${page.id}"></div>
                            <div class="slide-arrow" onclick="moveSlider('${page.id}', 1)">〉</div>
                        </div>
                        <div class="indicator-dots" id="dots-${page.id}"></div>
                        <div class="content-display-panel">
                            <div class="dynamic-title-group">
                                <h3 class="dynamic-main-title" id="${page.id}-render-title"></h3>
                                <span class="dynamic-sub-quote" id="${page.id}-render-quote"></span>
                            </div>
                            <div class="dynamic-body-text" id="${page.id}-render-body"></div>
                        </div>
                    `;
                } else if (page.type === 'news') {
                    overlay.innerHTML = `
                        <div class="page-header-area">
                            <div>
                                <h2 class="page-main-title">${page.title || ''}</h2>
                                <div class="page-sub-title">${page.subTitle || ''}</div>
                            </div>
                            <div class="page-back-btn" onclick="navigateToPage('home')"><span>返回主页</span></div>
                        </div>
                        <div class="page-layout-container">
                            <div class="noti-sidebar-list" id="noti-list-container"></div>
                            <div class="generic-detail-panel">
                                <h3 class="detail-title" id="nd-title"></h3>
                                <div class="detail-meta" id="nd-meta"></div>
                                <div class="detail-content" id="nd-content"></div>
                            </div>
                        </div>
                    `;
                } else if (page.type === 'media') {
                    overlay.innerHTML = `
                        <div class="page-header-area">
                            <div>
                                <h2 class="page-main-title">${page.title || ''}</h2>
                                <div class="page-sub-title">${page.subTitle || ''}</div>
                            </div>
                            <div class="page-back-btn" onclick="navigateToPage('home')"><span>返回主页</span></div>
                        </div>
                        <ul class="media-capsule-container" id="media-capsules-wrap"></ul>
                        <div class="media-grid-container" id="media-matrix-grid"></div>
                    `;
                }

                container.appendChild(overlay);
            });

            const secondPage = pagesConfig[1];
            if (secondPage) {
                document.getElementById('hero-arrow-btn').onclick = () => navigateToPage(secondPage.id);
            }
        }

        let simulatedProgress = 0;
        const progressNumNode = document.getElementById('load-num-node');
        const progressFillNode = document.getElementById('load-bar-node');
        const loaderContainer = document.getElementById('global-app-loading-container');

        const loadingInterval = setInterval(() => {
            if (simulatedProgress < 90) {
                simulatedProgress += Math.floor(Math.random() * 10) + 5;
                if (simulatedProgress > 90) simulatedProgress = 90;
                applyLoadingUpdate(simulatedProgress);
            }
        }, 30);

        function applyLoadingUpdate(val) {
            if(progressNumNode) progressNumNode.innerText = `${val}%`;
            if(progressFillNode) progressFillNode.style.width = `${val}%`;
        }

        window.addEventListener('load', () => {
            clearInterval(loadingInterval);
            applyLoadingUpdate(100);

            setTimeout(() => {
                if(loaderContainer) {
                    loaderContainer.classList.add('loader-vanish');
                }
                if (currentPageId === 'media') triggerMediaStaggerAnimation();
            }, 100);
        });

        function navigateToPage(targetPageId, pushState = true) {
            if (targetPageId === currentPageId || !PAGE_SEQUENCE.includes(targetPageId)) return;

            const stageEl = document.getElementById('main-stage');
            const oldIndex = PAGE_SEQUENCE.indexOf(currentPageId);
            const newIndex = PAGE_SEQUENCE.indexOf(targetPageId);
            const isTargetOnRight = newIndex > oldIndex;

            if (pushState) {
                const newUrl = targetPageId === 'home' ? window.location.pathname : `?page=${targetPageId}`;
                window.history.pushState({ page: targetPageId }, '', newUrl);
            }

            let oldOverlayEl = document.getElementById(`view-${currentPageId}-page`);
            let targetOverlayEl = document.getElementById(`view-${targetPageId}-page`);

            document.querySelectorAll('.fullview-overlay').forEach(el => {
                if (el !== oldOverlayEl && el !== targetOverlayEl) {
                    el.className = 'fullview-overlay';
                }
            });

            if (currentPageId === 'home') {
                stageEl.classList.add('stage-hidden');
            } else if (oldOverlayEl) {
                oldOverlayEl.classList.remove('active-page');
                oldOverlayEl.classList.add(isTargetOnRight ? 'exit-to-left' : 'exit-to-right');
            }

            if (targetPageId !== 'home' && targetOverlayEl) {
                targetOverlayEl.classList.remove('exit-to-left', 'exit-to-right');
                targetOverlayEl.classList.add('render-block');
                targetOverlayEl.classList.add(isTargetOnRight ? 'prepare-from-right' : 'prepare-from-left');

                targetOverlayEl.getBoundingClientRect(); 
                targetOverlayEl.classList.add('active-page');
            } else if (targetPageId === 'home') {
                stageEl.classList.remove('stage-hidden');
            }

            currentPageId = targetPageId;
            document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('active'));
            const navBtnEl = document.getElementById(`nav-${targetPageId}`);
            if (navBtnEl) navBtnEl.classList.add('active');

            if (sliderIndices[targetPageId] !== undefined) renderSlider(targetPageId);
            if (targetPageId === 'media') triggerMediaStaggerAnimation();
        }

        function openCinemaTheater() {
            const theaterLayer = document.getElementById('global-cinema-layer');
            const injectionPoint = document.getElementById('cinema-injection-point');
            const fallbackAnchor = document.getElementById('cinema-fallback-anchor');

            const finalBvid = "BV1RwFZzTEQ5";
            fallbackAnchor.href = `https://www.bilibili.com/video/${finalBvid}`;

            theaterLayer.style.display = 'flex';
            requestAnimationFrame(() => {
                theaterLayer.classList.add('theater-manifest');
            });

            injectionPoint.innerHTML = `
                <iframe class="cinema-iframe-core" 
                        src="https://player.bilibili.com/player.html?bvid=${finalBvid}&page=1&high_quality=1&danmaku=0&autoplay=1" 
                        scrolling="no" 
                        border="0" 
                        frameborder="no" 
                        framespacing="0" 
                        allow="autoplay; encrypted-media; fullscreen"
                        sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts allow-popups">
                </iframe>`;
        }

        function closeCinemaTheater() {
            const theaterLayer = document.getElementById('global-cinema-layer');
            const injectionPoint = document.getElementById('cinema-injection-point');

            theaterLayer.classList.remove('theater-manifest');
            setTimeout(() => {
                theaterLayer.style.display = 'none';
                injectionPoint.innerHTML = '';
            }, 200);
        }

        function buildSliderPage(pageKey) {
            const pageData = pagesConfig.find(p => p.id === pageKey);
            if (!pageData || !pageData.items) return;

            const viewport = document.getElementById(`cards-viewport-${pageKey}`);
            const dotsContainer = document.getElementById(`dots-${pageKey}`);
            if (!viewport || !dotsContainer) return;

            viewport.innerHTML = '';
            dotsContainer.innerHTML = '';

            pageData.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'showcase-card';
                if (item.bgImg) card.style.backgroundImage = `url('${item.bgImg}')`;
                viewport.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `indicator-dot ${idx === sliderIndices[pageKey] ? 'active' : ''}`;
                dot.onclick = () => { sliderIndices[pageKey] = idx; renderSlider(pageKey); };
                dotsContainer.appendChild(dot);
            });

            renderSlider(pageKey);
        }

        function moveSlider(pageKey, direction) {
            const pageData = pagesConfig.find(p => p.id === pageKey);
            if (!pageData || !pageData.items || pageData.items.length === 0) return;
            const items = pageData.items;
            let currentIdx = sliderIndices[pageKey] + direction;
            if (currentIdx < 0) currentIdx = items.length - 1;
            if (currentIdx >= items.length) currentIdx = 0;
            sliderIndices[pageKey] = currentIdx;
            renderSlider(pageKey);
        }

        function renderSlider(pageKey) {
            const pageData = pagesConfig.find(p => p.id === pageKey);
            if (!pageData || !pageData.items || pageData.items.length === 0) return;
            const items = pageData.items;
            const currentIdx = sliderIndices[pageKey];
            const pageOverlay = document.getElementById(`view-${pageKey}-page`);
            if (!pageOverlay) return;

            const cards = pageOverlay.querySelectorAll('.showcase-card');
            cards.forEach((card, idx) => {
                card.className = 'showcase-card';
                if (idx === currentIdx) card.classList.add('active');
                else if (idx === (currentIdx - 1 + items.length) % items.length) card.classList.add('prev');
                else if (idx === (currentIdx + 1) % items.length) card.classList.add('next');
            });

            const dots = pageOverlay.querySelectorAll('.indicator-dot');
            dots.forEach((dot, idx) => { dot.classList.toggle('active', idx === currentIdx); });

            const data = items[currentIdx];
            if (data) {
                document.getElementById(`${pageKey}-render-title`).innerText = data.title || '';
                document.getElementById(`${pageKey}-render-quote`).innerText = data.quote || '';
                document.getElementById(`${pageKey}-render-body`).innerHTML = data.body || '';
            }
        }

        function buildNotificationList() {
            const pageData = pagesConfig.find(p => p.type === 'news');
            if (!pageData || !pageData.items) return;
            const newsData = pageData.items;

            const listContainer = document.getElementById('noti-list-container');
            if (!listContainer || newsData.length === 0) return;
            listContainer.innerHTML = ''; 

            newsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `noti-item-card ${index === currentActiveNotiIdx ? 'item-active' : ''}`;
                card.onclick = () => switchNotiDetail(index, card, newsData);

                const dateEl = document.createElement('div');
                dateEl.className = 'noti-item-date';
                dateEl.innerText = item.date;

                const titleEl = document.createElement('div');
                titleEl.className = 'noti-item-title';
                titleEl.innerText = item.title;

                card.appendChild(dateEl);
                card.appendChild(titleEl);
                listContainer.appendChild(card);
            });
            refreshNotiDetailText(newsData);
        }

        function switchNotiDetail(index, element, newsData) {
            document.querySelectorAll('.noti-item-card').forEach(card => card.classList.remove('item-active'));
            if(element) element.classList.add('item-active');
            currentActiveNotiIdx = index;
            refreshNotiDetailText(newsData);
        }

        function refreshNotiDetailText(newsData) {
            if (!newsData || newsData.length === 0) return;
            const data = newsData[currentActiveNotiIdx];
            if (!data) return;
            document.getElementById('nd-title').innerText = data.title || '';
            document.getElementById('nd-meta').innerText = data.meta || '';
            document.getElementById('nd-content').innerHTML = data.content || '';
        }

        function buildMediaLayout() {
            const pageData = pagesConfig.find(p => p.type === 'media');
            if (!pageData) return;

            const capsuleContainer = document.getElementById('media-capsules-wrap');
            const gridContainer = document.getElementById('media-matrix-grid');
            if (!capsuleContainer || !gridContainer) return;

            capsuleContainer.innerHTML = '';
            if (pageData.tabs) {
                pageData.tabs.forEach((tabName) => {
                    const li = document.createElement('li');
                    li.className = 'media-capsule-btn capsule-active';
                    li.innerText = tabName;
                    capsuleContainer.appendChild(li);
                });
            }

            gridContainer.innerHTML = '';
            if (pageData.items) {
                pageData.items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'media-matrix-card';
                    card.onclick = () => openCinemaTheater(); 

                    const coverWrap = document.createElement('div');
                    coverWrap.className = 'matrix-video-cover-wrap';

                    const coverImg = document.createElement('img');
                    coverImg.src = item.img || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80';
                    coverImg.alt = item.title || 'Video Cover';

                    const playIndicator = document.createElement('div');
                    playIndicator.className = 'matrix-play-indicator';

                    const playIcon = document.createElement('div');
                    playIcon.className = 'matrix-play-icon';
                    playIcon.innerText = '▶';

                    playIndicator.appendChild(playIcon);
                    coverWrap.appendChild(coverImg);
                    coverWrap.appendChild(playIndicator);

                    const titleEl = document.createElement('div');
                    titleEl.className = 'matrix-card-title';
                    titleEl.innerText = item.title || '未命名媒体流';

                    card.appendChild(coverWrap);
                    card.appendChild(titleEl);
                    gridContainer.appendChild(card);
                });
            }

            triggerMediaStaggerAnimation();
        }

        function triggerMediaStaggerAnimation() {
            if (loaderContainer && !loaderContainer.classList.contains('loader-vanish')) return;

            const cards = document.querySelectorAll('.media-matrix-card');
            cards.forEach((card, index) => {
                card.classList.remove('reveal-manifest');
                setTimeout(() => { 
                    card.classList.add('reveal-manifest'); 
                }, index * 15); 
            });
        }

        /* ================= 经典星空与流动列车背景动画引擎 ================= */
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [], meteors = [], trainX = -1000;
        const colors = ['rgba(2, 132, 199, ', 'rgba(56, 189, 248, ', 'rgba(37, 99, 235, '];

        class Meteor {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width * 0.7; this.y = Math.random() * (canvas.height * 0.3);
                this.len = Math.random() * 80 + 40; this.speed = Math.random() * 4 + 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() { this.x += this.speed; this.y += this.speed * 0.4; if (this.x > canvas.width || this.y > canvas.height) this.reset(); }
            draw() {
                ctx.save(); ctx.beginPath();
                let gradient = ctx.createLinearGradient(this.x, this.y, this.x - this.len, this.y - this.len * 0.4);
                gradient.addColorStop(0, '#0284c7'); gradient.addColorStop(0.2, this.color + '0.4)'); gradient.addColorStop(1, 'transparent');
                ctx.strokeStyle = gradient; ctx.lineWidth = 1.2;
                ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.len, this.y - this.len * 0.4);
                ctx.stroke(); ctx.restore();
            }
        }

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.dist = Math.sqrt(Math.pow(this.x - canvas.width/2, 2) + Math.pow(this.y - canvas.height/2, 2));
                this.angle = Math.atan2(this.y - canvas.height/2, this.x - canvas.width/2);
                this.size = Math.random() * 1.2 + 0.4; this.speed = Math.random() * 0.0003 + 0.0001;
                this.color = colors[Math.floor(Math.random() * colors.length)] + (Math.random() * 0.4 + 0.3) + ')';
            }
            update() { this.angle += this.speed; }
            draw() {
                const x = canvas.width/2 + Math.cos(this.angle) * this.dist;
                const y = canvas.height/2 + Math.sin(this.angle) * this.dist;
                ctx.beginPath(); ctx.fillStyle = this.color; ctx.arc(x, y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawGhostTrain() {
            ctx.save(); 
            ctx.globalAlpha = 0.2; 
            ctx.strokeStyle = "#0284c7"; 
            ctx.lineWidth = 1.5; 

            const trainY = canvas.height * 0.82; 
            trainX += 1.0; 
            if (trainX > canvas.width + 600) trainX = -800;

            for(let i=0; i<5; i++) { 
                let bx = trainX - (i * 120); 
                ctx.strokeRect(bx, trainY, 110, 18);
            }
            ctx.restore();
        }

        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = []; meteors = [];
            for (let i = 0; i < 100; i++) stars.push(new Star());
            for (let i = 0; i < 2; i++) meteors.push(new Meteor());
        }

        function animate() {
            ctx.fillStyle = 'rgba(240, 245, 255, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGhostTrain(); stars.forEach(s => { s.update(); s.draw(); }); meteors.forEach(m => { m.update(); m.draw(); });
            requestAnimationFrame(animate);
        }

        let touchStartX = 0;
        let touchStartY = 0;

        function initTouchSwipeEngine() {
            window.addEventListener('touchstart', (e) => {
                const theater = document.getElementById('global-cinema-layer');
                if (theater && theater.classList.contains('theater-manifest')) return;

                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                const theater = document.getElementById('global-cinema-layer');
                if (theater && theater.classList.contains('theater-manifest')) return;

                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;

                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                if (Math.abs(diffY) > Math.abs(diffX)) return;

                if (Math.abs(diffX) > 60) {
                    const target = e.target;
                    if (target.closest('.slider-showcase-container') || 
                        target.closest('.noti-sidebar-list') || 
                        target.closest('.media-capsule-container')) {
                        return; 
                    }

                    const currentIdx = PAGE_SEQUENCE.indexOf(currentPageId);
                    if (diffX < 0) {
                        if (currentIdx < PAGE_SEQUENCE.length - 1) navigateToPage(PAGE_SEQUENCE[currentIdx + 1]);
                    } else {
                        if (currentIdx > 0) navigateToPage(PAGE_SEQUENCE[currentIdx - 1]);
                    }
                }
            }, { passive: true });
        }

        window.addEventListener('popstate', (event) => {
            const page = (event.state && event.state.page) || 'home';
            navigateToPage(page, false);
        });

        window.addEventListener('resize', () => {
            initCanvas();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initDynamicStructure();

            pagesConfig.forEach(page => {
                if (page.type === 'slider') buildSliderPage(page.id);
                else if (page.type === 'news') buildNotificationList();
                else if (page.type === 'media') buildMediaLayout();
            });

            initCanvas(); 
            animate();
            initTouchSwipeEngine(); 

            const urlParams = new URLSearchParams(window.location.search);
            const initialPage = urlParams.get('page') || 'home';

            if (PAGE_SEQUENCE.includes(initialPage) && initialPage !== 'home') {
                currentPageId = initialPage;
                let targetOverlayEl = document.getElementById(`view-${initialPage}-page`);
                if (targetOverlayEl) {
                    document.getElementById('main-stage').classList.add('stage-hidden');
                    targetOverlayEl.classList.add('render-block');
                    targetOverlayEl.classList.add('active-page');
                    document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('active'));
                    let navBtnEl = document.getElementById(`nav-${initialPage}`);
                    if (navBtnEl) navBtnEl.classList.add('active');
                    if (sliderIndices[initialPage] !== undefined) renderSlider(initialPage);
                }
            }
        });
    </script>
</body>
</html>
